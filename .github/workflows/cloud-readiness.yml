name: Build private deployment candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-only:
    if: ${{ vars.SIGNGUARD_ZERO_SPEND_CONFIRMED == 'true' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.worker -t signguard-worker:phase4 .
      - run: docker build -f deploy/Dockerfile.ui -t signguard-ui:phase4 .
      - run: docker build -f deploy/Dockerfile.controller -t signguard-controller:phase4 .
      - run: docker save signguard-worker:phase4 signguard-ui:phase4 signguard-controller:phase4 | gzip > private-candidates.tar.gz
# Intentionally no production credentials, registry push, public ingress or deployment action.
