name: Cloud tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -c requirements-cloud.txt -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/generate_samples.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-pdfs-${{ matrix.python }}
          path: samples/
