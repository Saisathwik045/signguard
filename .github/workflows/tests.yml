name: Cloud tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    if: ${{ vars.SIGNGUARD_ZERO_SPEND_CONFIRMED == 'true' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pip>=26.2,<27'
      - run: pip install -c requirements-cloud.txt -e '.[dev]'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/generate_samples.py
      - run: python -m benchmarks.evaluate --per-family 2 --output benchmark-output --check
      - run: python -m benchmarks.phase3 --output phase3-output --variants 1 --seal
      - run: python -m benchmarks.phase3 --output phase3-output --split regression
      - run: python -c "import json; s = json.load(open('phase3-output/regression-summary.json')); assert not s['unexpected_errors']; assert s['supported_alert']['fn'] == 0"
  isolated-worker:
    if: ${{ vars.SIGNGUARD_ZERO_SPEND_CONFIRMED == 'true' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pip>=26.2,<27'
      - run: pip install -c requirements-cloud.txt -e '.[dev]'
      - run: docker build -f deploy/Dockerfile.worker -t signguard-worker:phase4 .
      - run: SIGNGUARD_DOCKER_TESTS=1 SIGNGUARD_WORKER_IMAGE=signguard-worker:phase4 pytest -q tests/test_phase3_security.py tests/test_phase6_security.py --junitxml=phase6-security-junit.xml
      - run: python scripts/image_inventory.py signguard-worker:phase4 phase6-image
      - run: bash scripts/scan_image.sh signguard-worker:phase4 phase6-image
      - run: pip-audit --no-deps --disable-pip -r phase6-image/installed-python.txt --format json --output phase6-image/dependency-audit.json
      - run: python scripts/verify_image_scan.py phase6-image/full-scan.json phase6-image/inventory.json --baseline evaluation/phase6/baseline-full-scan.json --output phase6-image/admission.json
      - run: bandit -r src -ll -f json -o bandit.json
      - run: pip-audit --skip-editable --format json --output dependency-audit.json
