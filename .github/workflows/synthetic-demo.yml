name: Synthetic-only cloud demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  isolated-generation-browser-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pip>=26.2,<27'
      - run: pip install -c requirements-cloud.txt -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Build actual worker and analyze bundled fixtures
        run: |
          docker build --pull -f deploy/Dockerfile.worker -t signguard-worker:phase4 .
          python -m scripts.build_synthetic_demo --analyze
          mkdir -p demo-artifacts
          cp src/signguard/demo_assets/manifest.json demo-artifacts/generation-manifest.json
          mkdir -p demo-artifacts/bundle
          cp src/signguard/demo_assets/* demo-artifacts/bundle/
          docker image inspect signguard-worker:phase4 > demo-artifacts/worker-image.json
      - name: Regression and actual isolation controls
        run: |
          SIGNGUARD_DOCKER_TESTS=1 SIGNGUARD_WORKER_IMAGE=signguard-worker:phase4 pytest -q tests/test_phase3_security.py tests/test_synthetic_demo.py --junitxml=demo-artifacts/unit-junit.xml
      - name: Build synthetic viewer without PDF parsers
        run: |
          docker build --pull -f deploy/Dockerfile.demo -t signguard-demo:synthetic .
          docker run --rm --network=none --read-only --cap-drop=ALL --entrypoint=python signguard-demo:synthetic -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('pymupdf', 'pyhanko', 'cv2', 'signguard.client', 'signguard.executor'))"
      - name: Real Chromium navigation, images, downloads and screenshots
        run: SIGNGUARD_DEMO_BROWSER=1 SIGNGUARD_DEMO_CONTAINER=1 pytest -q tests/browser/test_synthetic_demo.py --junitxml=demo-artifacts/browser-junit.xml
      - name: Fresh OS scans and installed worker dependency audit
        run: |
          mkdir -p demo-artifacts/os-cache
          for target in signguard-worker:phase4 signguard-demo:synthetic; do
            report="$(echo "$target" | tr ':/' '--')"
            docker run --rm --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" --cap-drop=ALL --security-opt=no-new-privileges --memory=3g -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD/demo-artifacts:/out" aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --cache-dir /out/os-cache --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --pkg-types os --format json --output "/out/os-$report.json" "$target"
          done
          docker run --rm --network=none --read-only --cap-drop=ALL --entrypoint=python signguard-worker:phase4 -m pip freeze --all | sed '/^signguard[ =@]/Id' > demo-artifacts/installed-worker.txt
          pip-audit --no-deps --disable-pip -r demo-artifacts/installed-worker.txt --format json --output demo-artifacts/dependency-audit.json
          python scripts/check_os_release.py demo-artifacts/os-signguard-worker-phase4.json demo-artifacts/os-signguard-demo-synthetic.json --output demo-artifacts/release-admission.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-demo-security-and-browser-evidence
          path: |
            demo-artifacts/
            !demo-artifacts/os-cache/**
          retention-days: 7
# Functional CI success does not approve image admission. No deployment, secrets or ingress action.
