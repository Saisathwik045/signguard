name: Rootless worker qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rootless:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements-cloud.txt -e '.[dev]'
      - run: docker build -f deploy/Dockerfile.worker -t signguard-worker:rootless-qualification .
      - name: Set up a distinct rootless daemon
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session docker-ce-rootless-extras
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl restart "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          dockerd-rootless-setuptool.sh install --force
          echo "SIGNGUARD_DOCKER_SOCKET=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Load the exact built worker into the separate daemon
        run: docker save signguard-worker:rootless-qualification | docker --host="$SIGNGUARD_DOCKER_SOCKET" load
      - name: Probe real rootless cgroups, UID, read-only root, networking and credential removal
        run: python scripts/check_rootless_worker.py signguard-worker:rootless-qualification rootless-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootless-worker-qualification
          path: rootless-evidence.json
          retention-days: 7
# Passing a rootless CI probe does not attest a not-yet-provisioned EC2 host or approve ingress.
