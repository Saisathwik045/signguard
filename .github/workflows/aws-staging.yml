name: AWS staging preparation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply, publish-stage]
        default: plan
      spending_approved:
        description: Explicit owner approval of approximately USD 40/month, variable usage extra
        type: boolean
        default: false
      maintenance_ingress_approved:
        description: Separately approve HTTP ACME and HTTPS authenticated maintenance; uploads stay disabled
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements-cloud.txt -e '.[dev]' cfn-lint
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - run: terraform -chdir=deploy/aws fmt -recursive -check
      - run: terraform -chdir=deploy/aws init -backend=false
      - run: terraform -chdir=deploy/aws validate
      - run: terraform -chdir=deploy/aws test -junit-xml=terraform-junit.xml
      - run: cfn-lint deploy/aws/bootstrap.cfn.json
      - run: for script in deploy/aws/host/*.sh; do bash -n "$script"; done
      - run: pytest -q tests/test_aws_deployment.py tests/test_production_gateway.py --junitxml=phase9-unit-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-preparation-verification
          include-hidden-files: true
          path: |
            phase9-unit-junit.xml
            deploy/aws/terraform-junit.xml
            deploy/aws/.terraform.lock.hcl
          retention-days: 7
  authorized-infrastructure:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation != 'publish-stage'
    needs: [validate]
    environment: aws-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_ami_id: ${{ vars.AWS_AMI_ID }}
      TF_VAR_instance_profile: signguard-staging-runtime
      TF_VAR_spending_authorized: ${{ inputs.spending_approved }}
      TF_VAR_allow_private_ingress: ${{ inputs.maintenance_ingress_approved }}
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Refuse absent account, unapproved apply or an unreviewed AMI
        env:
          OPERATION: ${{ inputs.operation }}
          APPROVED: ${{ inputs.spending_approved }}
        run: |
          python - <<'PY'
          import os,re
          assert re.fullmatch('[0-9]{12}',os.environ['TF_VAR_account_id'])
          assert re.fullmatch('ami-[0-9a-f]+',os.environ['TF_VAR_ami_id'])
          assert os.environ['OPERATION'] != 'apply' or os.environ['APPROVED']=='true'
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Verify pinned AMI publisher and architecture
        run: |
          aws ec2 describe-images --image-ids "$TF_VAR_ami_id" --output json > /tmp/ami.json
          python - <<'PY'
          import json
          image=json.load(open('/tmp/ami.json'))['Images'][0]
          assert image['OwnerId']=='099720109477' and image['Architecture']=='x86_64'
          assert image['State']=='available' and 'ubuntu' in image['Name'].lower() and '24.04' in image['Name']
          PY
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - run: terraform -chdir=deploy/aws init -backend-config="bucket=signguard-staging-state-$TF_VAR_account_id" -backend-config="key=terraform/staging.tfstate" -backend-config=region=us-east-1 -backend-config=encrypt=true -backend-config=use_lockfile=true
      - run: terraform -chdir=deploy/aws plan -out=reviewed.tfplan
      - name: Apply only after protected environment review and explicit billing approval
        if: inputs.operation == 'apply' && inputs.spending_approved
        run: terraform -chdir=deploy/aws apply reviewed.tfplan
      - name: Record prospective outputs without claiming deployment
        if: inputs.operation == 'apply' && inputs.spending_approved
        run: terraform -chdir=deploy/aws output -json > prospective-infrastructure.json
      - uses: actions/upload-artifact@v4
        if: success() && inputs.operation == 'apply'
        with:
          name: prospective-aws-infrastructure
          path: prospective-infrastructure.json
          retention-days: 7
# No automatic apply, no public upload ingress, no credentials in source or Terraform values.
  publish-maintenance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'publish-stage' && inputs.spending_approved
    needs: [validate]
    environment: aws-staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      SIGNGUARD_TLS_CONTACT_EMAIL: ${{ vars.SIGNGUARD_TLS_CONTACT_EMAIL }}
      AWS_REGION: us-east-1
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_ami_id: ${{ vars.AWS_AMI_ID }}
      TF_VAR_instance_profile: signguard-staging-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements-cloud.txt -e '.[dev]'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - run: terraform -chdir=deploy/aws init -backend-config="bucket=signguard-staging-state-$AWS_ACCOUNT_ID" -backend-config="key=terraform/staging.tfstate" -backend-config=region=us-east-1 -backend-config=encrypt=true -backend-config=use_lockfile=true
      - run: terraform -chdir=deploy/aws output -json > /tmp/aws-outputs.json
      - name: Build the existing service images
        run: |
          docker build -f deploy/Dockerfile.worker -t signguard-worker:aws .
          docker build -f deploy/Dockerfile.ui --build-arg WORKER_IMAGE=signguard-worker:aws -t signguard-ui:aws .
          docker build -f deploy/Dockerfile.controller -t signguard-controller:aws .
      - name: Scan every actual deployable service image and enforce existing gates
        run: |
          for role in worker ui controller; do
            bash scripts/scan_image.sh "signguard-$role:aws" "aws-release/$role"
          done
          python scripts/check_os_release.py aws-release/worker/full-scan.json aws-release/ui/full-scan.json aws-release/controller/full-scan.json --output aws-release/admission.json --enforce
          python scripts/image_inventory.py signguard-worker:aws aws-release/worker
          pip-audit --no-deps --disable-pip -r aws-release/worker/installed-python.txt --format json --output aws-release/worker/dependency-audit.json
          python scripts/verify_image_scan.py aws-release/worker/full-scan.json aws-release/worker/inventory.json --baseline evaluation/phase6/baseline-full-scan.json --output aws-release/worker/identity-admission.json
      - name: Publish immutable references and stage maintenance through SSM
        run: python -m scripts.aws_delivery /tmp/aws-outputs.json aws-release --stage
      - name: Remove temporary registry access
        if: always()
        run: docker logout "$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-maintenance-release
          path: |
            aws-release/
            !aws-release/source.tar.gz
          retention-days: 7
# Hosted sign-in/denial tests and release attestations are mandatory before a separate upload enablement change.
