# Development interface only. This is not process isolation or authentication.
[server]
maxUploadSize = 25
maxMessageSize = 50
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false

[theme]
base = "dark"
primaryColor = "#55d6bd"
backgroundColor = "#0b1620"
secondaryBackgroundColor = "#112331"
textColor = "#e5edf3"
