# Single-owner GitHub OAuth, not the old shared-password preview mode.
provider = "github"
http_address = "0.0.0.0:4180"
email_domains = ["*"]
github_users = ["Saisathwik045"]
scope = "read:user user:email"
cookie_name = "__Host-signguard"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "15m"
cookie_refresh = "1m"
reverse_proxy = true
proxy_websockets = true
skip_provider_button = true
pass_access_token = false
pass_authorization_header = false
set_authorization_header = false
request_logging = false
# OAuth credentials, redirect URL and cookie secret are root-only env files from Secrets Manager.
# Stateless cookie replay/logout revocation must be qualified before live uploads are released.
