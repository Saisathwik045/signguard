[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signguard"
version = "0.3.0"
description = "Explainable PDF signature and visual tampering triage"
requires-python = ">=3.11"
dependencies = ["pyHanko>=0.25,<0.36", "PyMuPDF>=1.24,<2", "opencv-python-headless>=4.10,<5", "Pillow>=13,<14", "numpy>=2,<3", "streamlit>=1.45,<2", "Authlib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "matplotlib>=3.9,<4", "pip-audit>=2.9,<3", "bandit>=1.8,<2"]

[project.scripts]
signguard = "signguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
